name: Deploy
run-name: Deploy from ${{ github.event_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

jobs:
  Deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      TZ: America/New_York

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create SSH directory
        run: mkdir -p ~/.ssh

      - name: Add SSH key
        run: echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

      - name: Set SSH key permissions
        run: chmod 600 ~/.ssh/id_rsa

      - name: Add SSH host keys
        run: ssh-keyscan track.fingerlakesrunners.org > ~/.ssh/known_hosts

      - name: Sync result files
        run: rsync -Prz --delete-after Results root@track.fingerlakesrunners.org:/var/TrackResults

      - name: Restart track leaderboard
        run: ssh root@track.fingerlakesrunners.org "cd /var/leaderboards && docker compose restart track"
